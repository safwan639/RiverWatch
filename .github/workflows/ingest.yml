name: Ingest river readings

on:
  schedule:
    # Every hour at :07 (UTC). Avoiding :00 helps, since that's when
    # GitHub's scheduler is busiest and runs get delayed or dropped.
    - cron: "7 * * * *"
  workflow_dispatch: # adds a "Run workflow" button for manual runs

# Never let two runs overlap.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # kill a stuck run instead of letting it hang

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run pipeline
        run: python pipeline.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}